# Include ONCE inside the existing nginx http {} context, after operator review.
# This map emits finite route labels only. It never logs raw path/query/header data.
map $uri $tsc_route_class {
    default "other";
    / "home";
    ~^/services/?$ "services";
    ~^/services/website-design/?$ "website-design";
    ~^/services/website-rescue/?$ "website-rescue";
    ~^/services/search-visibility/?$ "search-visibility";
    ~^/services/website-care/?$ "website-care";
    ~^/work/?$ "work";
    ~^/process/?$ "process";
    ~^/about/?$ "about";
    ~^/contact/?$ "contact";
    ~^/privacy/?$ "privacy";
    /api/demo "inquiry";
    /api/health "liveness";
    /api/ready "readiness";
    /api/config "public-config";
    ~^/(assets|animation|images|fonts)/ "asset";
    /robots.txt "robots";
    /sitemap.xml "sitemap";
}
log_format tsc_private escape=json
    '{"time":"$time_iso8601","edge_request_id":"$request_id",'
    '"app_request_id":"$upstream_http_x_request_id","route":"$tsc_route_class",'
    '"status":$status,"upstream_status":"$upstream_status",'
    '"duration":$request_time,"bytes":$body_bytes_sent}';
