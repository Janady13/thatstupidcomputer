<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSC native animation parity</title>
<style>body{background:#f4e5c4;color:#29261f;font:16px system-ui;margin:24px}button,select{font:inherit;padding:10px;margin:4px}button:focus-visible,select:focus-visible{outline:3px solid #ba5231}#status{position:sticky;top:0;background:#f4e5c4;padding:10px;z-index:1}canvas{background:transparent;width:360px;height:460px}#stage{display:flex;gap:24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px}.pair img{width:100%}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:32px}pre{white-space:pre-wrap}h3{grid-column:1/-1}</style>
<h1>TSC native animation acceptance</h1><p>Official WebGL2 versus the unchanged SVG rig, sampled at identical times. This local test performs native rendering and numerical comparison; inspect each visible pair before promotion.</p>
<button id="run">Run all native checks</button><label>Review character <select id="character"></select></label><label>Review action <select id="action"></select></label><button id="review">Show comparison</button>
<p id="status" role="status">Ready</p><div id="stage"><section><h2>Official native Rive</h2><canvas id="native" width="360" height="460"></canvas></section><section><h2>Source SVG</h2><canvas id="reference" width="360" height="460"></canvas></section></div><pre id="report"></pre><div id="gallery"></div>
<script src="/apps/web/public/animation/runtime/rive.js"></script><script type="module" src="/tests/animation/native-harness.mjs"></script></html>
